# redis.conf —— 最小可用配置（容器内路径）
# 密码通过 docker compose 的 --requirepass 传入，这里不要写死

bind 0.0.0.0
port 6379

# 保护模式：容器内网访问需要关闭；公网部署必须配合密码 + 防火墙
protected-mode no
timeout 0
tcp-keepalive 300

# 内存与淘汰策略：2G 上限，写满后淘汰最少使用的 key
maxmemory 2gb
maxmemory-policy allkeys-lru

# 持久化：RDB + AOF 同时开，重启不丢数据
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 危险命令禁用（防止误删）
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""

# 日志
loglevel notice
