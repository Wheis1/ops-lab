# prometheus.yml —— 采集本机 + 业务端口
# 校验：promtool check config /etc/prometheus/prometheus.yml
# 重载：curl -X POST http://127.0.0.1:9090/-/reload （需启动时加 --web.enable-lifecycle）

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab
    host: ecs-2c2g

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus 自己
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # 主机指标：CPU / 内存 / 磁盘 / 网络（node_exporter 默认 9100）
  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # MySQL 指标：mysqld_exporter 默认 9104
  - job_name: "mysql"
    static_configs:
      - targets: ["127.0.0.1:9104"]

  # 业务 HTTP 探活：blackbox_exporter 默认 9115
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:8082/lost/
          - http://127.0.0.1:8080/catering/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
