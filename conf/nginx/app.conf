# /etc/nginx/conf.d/app.conf
# 单机承载两个项目：按路径分流到不同端口，同一域名不同前缀
# 改完必须：nginx -t && nginx -s reload

upstream lost_app {
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream catering_app {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;                 # 没有域名就写 _，有域名换成实际域名

    access_log /var/log/nginx/app.access.log main;
    error_log  /var/log/nginx/app.error.log warn;

    client_max_body_size 20m;
    server_tokens off;             # 不暴露版本号

    # 失物招领：/lost/ -> 8082
    location /lost/ {
        proxy_pass http://lost_app/;      # 末尾的 / 会去掉 /lost 前缀
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 智慧餐饮：/catering/ -> 8080
    location /catering/ {
        proxy_pass http://catering_app/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # 静态资源交给 Nginx，减少后端压力
    location /static/ {
        alias /opt/app/src/static/;
        expires 7d;
        access_log off;
    }

    # 健康检查接口，给负载均衡/监控用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
