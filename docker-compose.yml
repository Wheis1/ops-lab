services:
  mysql:
    image: mysql:8.0
    container_name: stack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [stack]

  redis:
    image: redis:6.2
    container_name: stack-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [stack]

  app:
    image: openjdk:17-jdk-slim
    container_name: stack-app
    restart: unless-stopped
    command: ["sh", "-c", "java -Xms256m -Xmx512m -jar /app/sky.jar --server.port=8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sky_take_out?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKY_DATASOURCE_HOST: mysql
      SKY_DATASOURCE_PORT: "3306"
      SKY_DATASOURCE_DATABASE: sky_take_out
      SKY_DATASOURCE_USERNAME: ${MYSQL_USER}
      SKY_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SKY_REDIS_HOST: redis
      SKY_REDIS_PORT: "6379"
      SKY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKY_REDIS_DATABASE: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./app/sky.jar:/app/sky.jar:ro
      - ./logs/app:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    networks: [stack]

  nginx:
    image: nginx:alpine
    container_name: stack-nginx
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./conf/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    networks: [stack]

  prometheus:
    image: prom/prometheus:latest
    container_name: stack-prometheus
    restart: unless-stopped
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./conf/prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks: [stack]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: stack-alertmanager
    restart: unless-stopped
    volumes:
      - ./conf/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [stack]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: stack-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    ports:
      - "127.0.0.1:9100:9100"
    networks: [stack]

  grafana:
    image: grafana/grafana:latest
    container_name: stack-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [stack]

networks:
  stack:
    driver: bridge
